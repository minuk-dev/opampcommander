# This rule is not used by the project opampcommander-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to opampcommander.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: opampcommander-operator
    app.kubernetes.io/managed-by: kustomize
  name: remoteconfigschema-viewer-role
rules:
- apiGroups:
  - opampcommander.io
  resources:
  - remoteconfigschemas
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - opampcommander.io
  resources:
  - remoteconfigschemas/status
  verbs:
  - get
