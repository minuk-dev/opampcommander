# This rule is not used by the project opampcommander-operator itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants permissions to create, update, and delete resources within the opampcommander.io.
# This role is intended for users who need to manage these resources
# but should not control RBAC or manage permissions for others.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: opampcommander-operator
    app.kubernetes.io/managed-by: kustomize
  name: remoteconfigschema-editor-role
rules:
- apiGroups:
  - opampcommander.io
  resources:
  - remoteconfigschemas
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - opampcommander.io
  resources:
  - remoteconfigschemas/status
  verbs:
  - get
