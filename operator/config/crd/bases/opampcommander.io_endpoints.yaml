---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: endpoints.opampcommander.io
spec:
  group: opampcommander.io
  names:
    kind: Endpoint
    listKind: EndpointList
    plural: endpoints
    singular: endpoint
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Endpoint is the Schema for the endpoints API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of Endpoint
            properties:
              metricsQuery:
                description: EndpointMetricsQuery holds bounded PromQL templates,
                  without credentials.
                properties:
                  logs:
                    maxLength: 4096
                    type: string
                  metrics:
                    maxLength: 4096
                    type: string
                  traces:
                    maxLength: 4096
                    type: string
                type: object
              protocol:
                description: protocol is distribution-specific, for example otlphttp.
                maxLength: 64
                minLength: 1
                type: string
              signals:
                items:
                  description: TelemetrySignal identifies one supported telemetry
                    signal.
                  enum:
                  - metrics
                  - logs
                  - traces
                  - profiles
                  type: string
                maxItems: 4
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              tenants:
                items:
                  description: EndpointTenant keeps credential headers in native Secrets.
                  properties:
                    headers:
                      items:
                        description: HeaderReference obtains one HTTP header from
                          a local Secret key.
                        properties:
                          name:
                            maxLength: 128
                            minLength: 1
                            pattern: ^[A-Za-z0-9][A-Za-z0-9_-]*$
                            type: string
                          valueFrom:
                            description: SecretKeyReference selects private content
                              without embedding it in a CR.
                            properties:
                              key:
                                maxLength: 253
                                minLength: 1
                                pattern: ^[-._a-zA-Z0-9]+$
                                type: string
                              name:
                                minLength: 1
                                type: string
                            required:
                            - key
                            - name
                            type: object
                        required:
                        - name
                        - valueFrom
                        type: object
                      maxItems: 32
                      type: array
                      x-kubernetes-list-map-keys:
                      - name
                      x-kubernetes-list-type: map
                      x-kubernetes-validations:
                      - message: HTTP header names must be unique ignoring case
                        rule: self.map(h, h.name.lowerAscii()).all(name, self.exists_one(other,
                          other.name.lowerAscii() == name))
                    name:
                      minLength: 1
                      type: string
                    signals:
                      items:
                        description: TelemetrySignal identifies one supported telemetry
                          signal.
                        enum:
                        - metrics
                        - logs
                        - traces
                        - profiles
                        type: string
                      maxItems: 4
                      type: array
                      x-kubernetes-list-type: set
                  required:
                  - name
                  type: object
                maxItems: 64
                type: array
                x-kubernetes-list-map-keys:
                - name
                x-kubernetes-list-type: map
              url:
                description: url excludes embedded credentials, query strings and
                  fragments.
                maxLength: 2048
                pattern: ^(https?|grpc|grpcs)://[A-Za-z0-9.-]+(:[0-9]+)?(/[^?#]*)?$
                type: string
            required:
            - protocol
            - signals
            - url
            type: object
          status:
            description: status defines the observed state of Endpoint
            properties:
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 16
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
