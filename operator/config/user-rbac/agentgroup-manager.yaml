apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: opampcommander-agentgroup-manager
rules:
  - apiGroups: [opampcommander.io]
    resources: [agentgroups]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [opampcommander.io]
    resources: [remoteconfigs, remoteconfigschemas, agentpackages, endpoints]
    verbs: [get, list, watch]
