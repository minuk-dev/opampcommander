# Collector configuration for direct status/effective-config reporting.
# Extract spec.value into a local Collector config to use this example directly.
# The extension alone does not accept remote configuration. For Supervisor-managed
# collectors, use a pipeline template such as otlp-debug; Supervisor injects OpAMP.
kind: AgentRemoteConfig
apiVersion: v1
metadata:
  name: opamp-extension
  namespace: default
  attributes:
    managed-by: opampcommander
spec:
  contentType: text/yaml
  value: |
    extensions:
      health_check:
        endpoint: 0.0.0.0:13133
      opamp:
        server:
          ws:
            # Adjust to your opampcommander deployment's externally reachable URL.
            endpoint: ws://opampcommander.example.com:8080/api/v1/opamp
            tls:
              insecure: true
        # Set a unique, persistent UUID per installed Collector (do not share it).
        # instance_uid: "019a0000-0000-7000-8000-000000000001"
        # service.name/version/instance.id come from the Collector's own resource.
        # Additional descriptive attributes:
        agent_description:
          non_identifying_attributes:
            deployment.environment: production
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
    processors:
      batch:
    exporters:
      debug:
        verbosity: basic
    service:
      extensions: [health_check, opamp]
      telemetry:
        logs:
          level: info
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [batch]
          exporters: [debug]
