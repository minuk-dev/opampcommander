{{- if and .Values.apiserver.enabled (include "opampcommander.apiserver.runtimeConfigured" .) }}
{{- $runtime := .Values.apiserver.config.runtimeAPI }}
{{- /* Namespace names cannot contain dots, so the separator keeps release identities distinct. */}}
{{- $name := printf "%s.%s-runtime" .Release.Namespace .Release.Name }}
{{- $serviceAccount := include "opampcommander.apiserver.serviceAccountName" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccount }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $name }}
  namespace: {{ $runtime.installationNamespace | quote }}
rules:
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ $runtime.installationName | quote }}]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $name }}
  namespace: {{ $runtime.installationNamespace | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $serviceAccount }}
    namespace: {{ .Release.Namespace }}
{{- end }}
