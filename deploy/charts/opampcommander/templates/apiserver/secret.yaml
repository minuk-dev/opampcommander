{{- if and .Values.apiserver.enabled .Values.apiserver.secrets.create (not .Values.apiserver.secrets.existingSecret) }}
{{- $name := include "opampcommander.apiserver.fullname" . }}
{{- $secrets := .Values.apiserver.secrets }}
{{/*
Secrets left empty are generated once and then carried forward: `lookup` reads
the Secret already in the cluster so an upgrade does not rotate the JWT signing
key (invalidating every token) or the basic-auth pepper (invalidating every
stored password). `lookup` returns nothing during `helm template` and
`--dry-run`, so a render-then-apply (GitOps) flow must set these explicitly.
*/}}
{{- $current := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $data := (get $current "data") | default dict }}
{{- $keep := dict }}
{{- range $key, $value := $data }}
{{- $_ := set $keep $key (b64dec $value) }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opampcommander.apiserver.labels" . | nindent 4 }}
  {{- with (merge (dict) $secrets.annotations (.Values.commonAnnotations | default dict)) }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  adminUsername: {{ $secrets.adminUsername | default (get $keep "adminUsername") | default "admin" | quote }}
  adminPassword: {{ $secrets.adminPassword | default (get $keep "adminPassword") | default (randAlphaNum 24) | quote }}
  jwtSecret: {{ $secrets.jwtSecret | default (get $keep "jwtSecret") | default (randAlphaNum 48) | quote }}
  basicPepper: {{ $secrets.basicPepper | default (get $keep "basicPepper") | default (randAlphaNum 48) | quote }}
  oauth2StateJwtSecret: {{ $secrets.oauth2StateJwtSecret | default (get $keep "oauth2StateJwtSecret") | default (randAlphaNum 48) | quote }}
  oauth2ClientId: {{ $secrets.oauth2ClientId | default (get $keep "oauth2ClientId") | default "" | quote }}
  oauth2ClientSecret: {{ $secrets.oauth2ClientSecret | default (get $keep "oauth2ClientSecret") | default "" | quote }}
  directAuthToken: {{ $secrets.directAuthToken | default (get $keep "directAuthToken") | default "" | quote }}
{{- end }}
