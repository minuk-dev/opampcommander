{{- if and .Values.web.enabled .Values.web.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "opampcommander.web.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opampcommander.web.labels" . | nindent 4 }}
  {{- with (include "opampcommander.annotations" .) }}
  annotations:
    {{- . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.web.podDisruptionBudget.minAvailable }}
  minAvailable: {{ . }}
  {{- end }}
  {{- with .Values.web.podDisruptionBudget.maxUnavailable }}
  maxUnavailable: {{ . }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "opampcommander.web.selectorLabels" . | nindent 6 }}
{{- end }}
