# Create this Secret separately; never put production credentials in values.yaml.
apiserver:
  secrets:
    create: false
    existingSecret: ""
  config:
    database:
      type: mongodb
      endpoints: []
  extraEnv:
    - name: AUTH_ADMIN_PASSWORD_FILE
      value: /run/secrets/opampcommander/adminPassword
    - name: AUTH_JWT_SECRET_FILE
      value: /run/secrets/opampcommander/jwtSecret
    - name: AUTH_BASIC_PEPPER_FILE
      value: /run/secrets/opampcommander/basicPepper
    - name: AUTH_OAUTH2_CLIENTSECRET_FILE
      value: /run/secrets/opampcommander/oauth2ClientSecret
    - name: AUTH_OAUTH2_STATE_JWT_SECRET_FILE
      value: /run/secrets/opampcommander/oauth2StateJwtSecret
    - name: EVENT_DIRECT_AUTHTOKEN_FILE
      value: /run/secrets/opampcommander/directAuthToken
    - name: LIVENESS_REDIS_PASSWORD_FILE
      value: /run/secrets/opampcommander/redisPassword
    - name: DATABASE_ENDPOINTS_FILE
      value: /run/secrets/opampcommander/databaseURI
  extraVolumes:
    - name: secret-files
      secret:
        secretName: opampcommander-secret-files
  extraVolumeMounts:
    - name: secret-files
      mountPath: /run/secrets/opampcommander
      readOnly: true
