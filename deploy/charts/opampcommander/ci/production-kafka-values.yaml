# Multi-replica install: MongoDB persistence, Kafka coordination, ingress,
# and ServiceMonitor.
apiserver:
  replicaCount: 3
  config:
    database:
      type: mongodb
      endpoints:
        - "mongodb://mongodb-0.mongodb:27017,mongodb-1.mongodb:27017/?replicaSet=rs0"
      databaseName: opampcommander
      ddlAuto: true
    event:
      type: kafka
      kafka:
        brokers:
          - "kafka-0.kafka:9092"
        topic: "prod.opampcommander.events"
  ingress:
    enabled: true
    className: nginx
    annotations:
      nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
      nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    hosts:
      - host: api.opampcommander.example.com
    tls:
      - secretName: opampcommander-api-tls
        hosts:
          - api.opampcommander.example.com
  serviceMonitor:
    enabled: true
  podDisruptionBudget:
    enabled: true
