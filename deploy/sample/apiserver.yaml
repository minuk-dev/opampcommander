---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apiserver
  namespace: opampcommander
  labels:
    app: apiserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apiserver
  template:
    metadata:
      labels:
        app: apiserver
    spec:
      containers:
      - name: apiserver
        image: ghcr.io/minuk-dev/opampcommander:dev
        command:
        - /apiserver
        - --config=/etc/opampcommander/config.yaml
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 200m
            memory: 256Mi
        ports:
        - containerPort: 8080
          name: http
        volumeMounts:
        - name: config-volume
          mountPath: /etc/opampcommander
          readOnly: true
        livenessProbe:
          httpGet:
            path: /healthz
            port: 9090
          initialDelaySeconds: 5
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /readyz
            port: 9090
          initialDelaySeconds: 5
          timeoutSeconds: 5
      volumes:
      - name: config-volume
        configMap:
          name: apiserver-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: apiserver-config
  namespace: opampcommander
data:
  config.yaml: |
    address: 0.0.0.0:8080
    management:
      address: 0.0.0.0:9090
    database:
      type: "mongodb"
      endpoints:
      - "mongodb://mongodb.opampcommander.svc.cluster.local:27017"
      database: "opampcommander"
    metric:
      enabled: true
      type: prometheus
      endpoint: http://localhost:9090/metrics
    log:
      level: "info"
      format: "json"
---
apiVersion: v1
kind: Service
metadata:
  name: apiserver
  namespace: opampcommander
  labels:
    app: apiserver
spec:
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  selector:
    app: apiserver
  type: ClusterIP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apiserver-ingress
  namespace: opampcommander
spec:
  rules:
  - host: apiserver.opampcommander.local
    http:
      paths:
        - path: /api/v1/opamp
          pathType: Exact
          backend:
            service:
              name: apiserver
              port:
                number: 8080
