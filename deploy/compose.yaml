# Local evaluation only: loopback ports, no persistent storage.
services:
  apiserver:
    image: ghcr.io/minuk-dev/opampcommander:${OPAMP_VERSION:?Set OPAMP_VERSION to an apiserver image tag}
    entrypoint: ["/apiserver"]
    environment:
      ADDRESS: 0.0.0.0:8080
      MANAGEMENT_ADDRESS: 0.0.0.0:9090
      DATABASE_TYPE: inmemory
      EVENT_TYPE: inmemory
      BOOTSTRAP_DIR: /etc/opampcommander/initial
    ports:
      - "127.0.0.1:8080:8080"
