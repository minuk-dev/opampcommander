apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: operator-runtime-reader
  namespace: default
rules:
  - apiGroups: [runtime.opampcommander.io]
    resources: [namespaces]
    resourceNames: [default]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: operator-runtime-reader
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: operator-runtime-reader
subjects:
  - kind: ServiceAccount
    name: opampcommander-operator-controller-manager
    namespace: opampcommander-operator-system
