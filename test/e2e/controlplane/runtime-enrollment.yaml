apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: enrollment-account-reader
  namespace: runtime-enrollment
rules:
  - apiGroups: [""]
    resources: [serviceaccounts]
    resourceNames: [collector]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: enrollment-account-reader
  namespace: runtime-enrollment
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: enrollment-account-reader
subjects:
  - kind: ServiceAccount
    name: apiserver
    namespace: opamp-e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-enroller
  namespace: runtime-enrollment
rules:
  - apiGroups: [runtime.opampcommander.io]
    resources: [agentenrollments]
    resourceNames: [abc115aa-730b-4c1d-8638-e2b64eb27b34]
    verbs: [get, update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-enroller
  namespace: runtime-enrollment
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-enroller
subjects:
  - kind: ServiceAccount
    name: collector
    namespace: runtime-enrollment
