apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runtime-reader
  namespace: runtime-tenant
rules:
  - apiGroups: [runtime.opampcommander.io]
    resources: [namespaces]
    resourceNames: [runtime-tenant]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runtime-reader
  namespace: runtime-tenant
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: runtime-reader
subjects:
  - kind: ServiceAccount
    name: runtime-reader
    namespace: opamp-e2e
