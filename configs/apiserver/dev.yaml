address: localhost:8080
bootstrap:
  dir: ./configs/apiserver/initial # initial manifests reconciled into persistence on startup
  defaultNamespace: default
  defaultRole: default
database:
  type: "mongodb"
  endpoints:
  - "mongodb://localhost:27017"
  connectTimeout: 10s
  databaseName: "opampcommander"
  ddlAuto: true
management:
  address: localhost:9090
  metric:
    enabled: true
    type: prometheus
    prometheus:
      path: /metrics
    opentelemetry: # unused when type is prometheus
      endpoint: "localhost:4317"
  log:
    level: info
    format: text
  trace:
    enabled: true
    endpoint: "localhost:4317"
    protocol: grpc
    sampler: always
    insecure: true
auth:
  enabled: true
  admin:
    username: "admin"
    password: "admin"
  basic:
    # Server-side secret mixed into every basic-auth user password hash.
    # Set a long, random value and keep it stable. Empty disables DB-backed basic-auth users.
    pepper: "dev_basic_auth_pepper_change_me"
  jwt:
    issuer: "opampcommander"
    expire: 5m
    refreshExpire: 168h
    secret: "your_jwt_secret"
    audience:
    - "opampcommander"
  type: "oauth2"
  oauth2:
    provider: github
    clientId: "your_client_id"
    clientSecret: "your_client_secret"
    redirectUri: "http://localhost:8080/auth/callback"
    state: # to prevent CSRF attacks
      mode: jwt
      jwt:
        issuer: "opampcommander"
        expire: 5m
        secret: "your_jwt_secret"
        audience:
        - "opampcommander"
event:
  enabled: false  # Set to false for standalone mode (no inter-server communication)
  # Transport for inter-server events (pick one):
  #   "inmemory" - standalone mode (single node)
  #   "kafka"    - distributed mode via a broker (broadcast-and-filter)
  #   "direct"   - distributed mode, targeted peer-to-peer delivery (no broker)
  type: "inmemory"
  kafka:
    brokers:
      - "localhost:9092"
    topic: "dev.opampcommander.events"
  # Used when type == "direct". Each server dials the destination peer directly,
  # resolved from the server registry, so a targeted message reaches exactly one server.
  direct:
    subProtocol: "grpc"          # "grpc" or "http"
    listenAddress: ":8081"        # address this server's receiver binds to
    advertiseAddress: ""          # address peers dial to reach this server, e.g. "$POD_IP:8081"
