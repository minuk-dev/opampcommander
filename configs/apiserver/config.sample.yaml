address: localhost:8080
bootstrap:
  # Directory of initial manifest YAML files reconciled into persistence on startup
  # (declarative / full overwrite). Edit these files or point `dir` elsewhere to
  # change the built-in defaults. The container image ships them at
  # /etc/opampcommander/initial (also exposed via the BOOTSTRAP_DIR env var).
  dir: /etc/opampcommander/initial
  # Pre-built RemoteConfigSchema library (component catalog per collector
  # distribution/version). Empty defaults to <dir>/remoteconfigschema.
  # remoteConfigSchemaDir: /etc/opampcommander/initial/remoteconfigschema
  # Which schemas to seed on startup: latest (newest per distribution), all, or none.
  remoteConfigSchemaLoad: latest
  defaultNamespace: default # agents without a service.namespace land here
  defaultRole: default # built-in role auto-granted to every user
database:
  type: "mongodb"
  endpoints:
  - "mongodb://<user>:<password>@localhost:27017"
  connectTimeout: 10s
  databaseName: "opampcommander"
  ddlAuto: true
  # Enable sharding-aware schema management when running against a MongoDB
  # sharded cluster (point endpoints at mongos routers). Requires ddlAuto.
  # sharding:
  #   enabled: true
management:
  address: localhost:9090
  metric:
    enabled: true
    type: prometheus
    prometheus:
      path: /metrics
    opentelemetry: # unused when type is prometheus
      endpoint: "localhost:4317"
  log:
    level: "info"
    format: "json"
  trace:
    enabled: false
    endpoint: "localhost:4317"
auth:
  enabled: true
  admin:
    username: "admin"
    password: "admin_password"
  basic:
    # Server-side secret mixed into every basic-auth user password hash.
    # Set a long, random value and keep it stable for the lifetime of stored credentials.
    # Empty disables DB-backed basic-auth user creation and login.
    pepper: ""
  jwt:
    issuer: "opampcommander"
    expire: 5m
    refreshExpire: 168h
    secret: "your_jwt_secret"
    audience:
    - "opampcommander"
  type: "oauth2"
  oauth2:
    provider: github
    clientId: "your_client_id"
    clientSecret: "your_client_secret"
    redirectUri: "http://localhost:8080/auth/callback"
    # Additional hosts the /api/v1/auth/github/authcode endpoint will accept
    # as redirect_uri targets, on top of the always-allowed loopback hosts
    # (127.0.0.1, ::1, localhost). Set this to the deployed web UI host(s)
    # so browser logins from the dashboard work end-to-end.
    allowedRedirectHosts:
      - opampcommander.minuk.dev
    state: # to prevent CSRF attacks
      mode: jwt
      jwt:
        issuer: "opampcommander"
        expire: 5m
        secret: "your_jwt_secret"
        audience:
        - "opampcommander"
event:
  # enabled: Set to false for standalone mode (single server instance)
  # Set to true for distributed mode (multiple server instances with inter-server communication)
  enabled: false
  # type: Event protocol type - "inmemory" for standalone mode, "kafka" for distributed mode
  type: "inmemory"
  kafka:
    brokers:
      - "localhost:9092"
    topic: "prod.opampcommander.events"

# Agent liveness fast tier.
#
# Agent liveness — connected, lastReportedAt, sequenceNum — churns on every
# heartbeat but is worthless once stale: the next message from the agent rebuilds
# it. The server absorbs those updates in a fast tier and writes them through to
# the database on a slow cadence, so a large fleet stops costing one database
# write per agent per throttle window.
liveness:
  # How often absorbed liveness is written through to the database, and how far
  # behind a stored agent document must fall before that flush claims it.
  #
  # Their SUM is what matters: a stored document goes stale by up to
  # flushInterval + flushStaleAfter, and that has to stay inside the 60s budget
  # the 90s connection-staleness window allows. The server refuses to start
  # otherwise. The flush writes only the liveness fields, so a short cadence is
  # cheap — it is not a full document rewrite.
  flushInterval: 30s
  flushStaleAfter: 30s
  # Maximum agents written by one flush cycle.
  flushBatchSize: 2000
  # Minimum interval between database writes on the message path for an agent
  # whose only change is that it is still alive. Leave unset: 10s without a
  # shared fast tier (where it is the only thing keeping the document current),
  # and the 60s budget with one (where the flush owns the routine write path).
  # Capped at the budget either way.
  # persistThrottle: 10s

  # Redis is an optional accelerator and never required. Absent, misconfigured,
  # or down, the server keeps working on node-local state and the database — just
  # with more database writes. Ignored entirely in standalone mode
  # (database.type: inmemory).
  redis:
    enabled: false
    # One address is a single server; several address a cluster. Combine with
    # masterName to address a Sentinel set.
    endpoints:
      - "localhost:6379"
    # masterName: "mymaster"
    # username: ""
    # password: ""
    db: 0
    tls: false
    dialTimeout: 2s
    # Kept short deliberately: this is a fast path, and a slow Redis must degrade
    # to the database rather than hold up agent message processing.
    commandTimeout: 200ms
    # Must exceed the 90s staleness window, or a live agent's record would expire
    # while the agent is still considered connected.
    ttl: 120s
