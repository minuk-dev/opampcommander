# Renovate manages routine version updates. A zero PR limit disables duplicate
# Dependabot version PRs while leaving security updates enabled.
#
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates
# https://containers.dev/guide/dependabot

version: 2
updates:
  - package-ecosystem: "devcontainers"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0

  - package-ecosystem: "npm"
    directories:
      - "/web"
      - "/docs"
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
