name: helm-ci

permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'deploy/charts/**'
      - '.github/workflows/helm-ci.yaml'
  pull_request:
    paths:
      - 'deploy/charts/**'
      - '.github/workflows/helm-ci.yaml'

env:
  CHART: ./deploy/charts/opampcommander

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      # Renders the chart with the defaults and with every permutation in ci/,
      # so a values combination that only breaks in one shape still fails here.
      - name: helm lint
        run: make helm-lint

  validate:
    name: validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: Install kubeconform
        run: |
          curl -sSfL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            | tar -xz -C /usr/local/bin kubeconform
      # Schema-checks the rendered output against the Kubernetes API. CRDs the
      # cluster may not have (ServiceMonitor) are skipped rather than failing.
      - name: kubeconform
        run: |
          set -euo pipefail
          for values in "${CHART}"/ci/*-values.yaml; do
            echo "==> ${values}"
            helm template opampcommander "${CHART}" -f "${values}" \
              | kubeconform -strict -summary -ignore-missing-schemas \
                  -kubernetes-version 1.29.0 -
          done

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.18.4
      - name: helm package
        run: helm package "${CHART}" --destination ./dist
      - uses: actions/upload-artifact@v4
        with:
          name: helm-chart
          path: dist/*.tgz
