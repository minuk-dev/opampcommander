name: test
permissions:
  contents: read
on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # octocov posts the coverage report as a PR comment
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run unit tests
        run: make test

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Report coverage (octocov)
        uses: k1LoW/octocov-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: true
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Run E2E tests
        run: make test-e2e
        # Note: E2E tests run without -race flag due to known issues in external Kafka library (IBM/sarama)

  collector-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        transport: [ws, http]
    env:
      OPAMP_TEST_CURRENT_CLIENTS: "1"
      CLIENT_TRANSPORT: ${{ matrix.transport }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Current Collector and Supervisor lifecycle
        run: go test -tags=e2e ./test/e2e/apiserver -run "TestE2E_Current/${CLIENT_TRANSPORT}$" -parallel=1 -v -timeout=8m
      - name: Reference-client mTLS rotation regression
        if: matrix.transport == 'ws'
        run: go test -tags=e2e ./test/e2e/apiserver -run TestE2E_OpAMPMTLSRotate -parallel=1 -timeout=3m
      - name: Validate shipped Collector examples
        if: matrix.transport == 'ws'
        shell: bash
        run: |
          image=ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-contrib:0.163.1
          for config in scripts/opampextension-ws.yaml scripts/opampextension-http.yaml scripts/collector-supervised.yaml; do
            docker run --rm -v "$PWD:/repo:ro" "$image" validate --config="/repo/$config"
          done
          go run ./cmd/opampctl template agentremoteconfig opamp-extension -o json | jq -r '.spec.value' > /tmp/opamp-example.yaml
          docker run --rm -v /tmp/opamp-example.yaml:/example.yaml:ro "$image" validate --config=/example.yaml
